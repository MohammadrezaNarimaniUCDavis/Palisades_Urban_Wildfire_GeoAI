  <circle cx="32" cy="32" r="22" fill="#ffffff" stroke="#252525" stroke-width="1.2"/>
  <polygon points="32,16 27,34 37,34" fill="#252525"/>
  <text x="32" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#252525">N</text>
  <text x="32" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#252525">S</text>
  <text x="58" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#252525">E</text>
  <text x="6" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#252525">W</text>
</svg>
